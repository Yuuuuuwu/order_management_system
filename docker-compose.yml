version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: oms_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: my_db
      MYSQL_USER: jenny
      MYSQL_PASSWORD: 1234
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build: .
    container_name: oms_app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    restart: unless-stopped
    command: >
      sh -c "
        flask db upgrade &&
        python scripts/seed_data.py &&
        flask run --host=0.0.0.0 --port=5000
      "
    networks:
      - app-network

  frontend:
    build:
      context: ../oms-frontend-antd
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL}
    container_name: oms_frontend
    ports:
      - "3000:80"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
